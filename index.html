<div class="header" role="banner"><h1>📈 <span>Index</span> Portfolio Dashboard</h1><div class="header-sub">8 индексов + портфель • FX калькуляция • Ребалансировка</div><button class="theme-toggle" id="langBtn" onclick="toggleLang()" title="Язык / Language" aria-label="Язык / Language" style="font-size:11px;font-weight:700">EN</button><button class="theme-toggle" id="ui2Btn" onclick="toggleUI2()" title="Новый интерфейс (2026)" aria-label="Новый интерфейс / New UI">✨</button><button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Переключить тему" aria-label="Переключить тему / Toggle theme">🌙</button><button class="theme-toggle" id="editBtn" onclick="toggleEdit()" title="Редактор раскладки / Layout editor" aria-label="Редактор раскладки / Layout editor" style="display:none">✏️</button><button class="theme-toggle" id="settingsBtn" onclick="toggleSettings()" title="Настройки доступа" aria-label="Настройки доступа / Access settings" style="display:none">⚙️</button><button class="theme-toggle" id="promptBtn" onclick="togglePrompts()" title="AI-промпты" aria-label="AI-промпты / AI prompts" style="display:none">📜</button><button class="theme-toggle" id="faqBtn" onclick="toggleFaq()" title="Справка по обозначениям" aria-label="Справка / Help">❓</button><button class="theme-toggle" id="logoutBtn" onclick="handleLogout()" title="Выйти" aria-label="Выйти / Log out" style="display:none">⏻</button></div>
