<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index Portfolio Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('dash_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="header"><h1>📈 <span>Index</span> Portfolio Dashboard</h1><div class="header-sub">8 индексов + портфель • FX калькуляция • Ребалансировка</div><button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Переключить тему">🌙</button><button class="theme-toggle" id="logoutBtn" onclick="handleLogout()" title="Выйти" style="display:none">⏻</button></div>
<div class="tabs" id="tabs"></div>
<div class="sub-tabs" id="subTabs"></div>
<div class="sma-banner" id="smaBanner"></div>
<div class="pf-summary" id="pfSummary" style="display:none"></div>
<div class="fx-bar" id="fxBar" style="display:none"></div>
<div class="toolbar" id="toolbarEl"><div class="index-info" id="indexInfo"></div><input type="text" class="search-box" id="searchBox" placeholder="🔍 Поиск..."><button class="btn" onclick="resetSort()">↕ Сброс</button><button class="btn" id="colsBtn" onclick="toggleColsMenu()" title="Показать/скрыть колонки">⚙ Колонки</button><button class="btn btn-del" id="delBtn" onclick="deleteSelected()" style="display:none">🗑</button><button class="btn" id="refreshPricesBtn" onclick="refreshLivePrices()" title="Обновить цены через Finnhub">🔄 Цены</button><button class="btn btn-export" onclick="exportCSV()">📥 CSV</button></div>
<div class="stats" id="statsBar"></div>
<div id="contentArea"><div class="table-wrap" id="tableArea"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div id="rankingArea" style="display:none;padding-bottom:24px"></div><div id="rebalArea" style="display:none;padding-bottom:24px"></div><div id="plan10Area" style="display:none;padding-bottom:24px"></div><div id="divpfArea" style="display:none;padding-bottom:24px"></div><div id="growpfArea" style="display:none;padding-bottom:24px"></div><div id="balpfArea" style="display:none;padding-bottom:24px"></div><div id="balpf2Area" style="display:none;padding-bottom:24px"></div><div id="table2Area" style="display:none;padding-bottom:24px"></div><div id="plan2026Area" style="display:none;padding-bottom:24px"></div><div id="plan2036Area" style="display:none;padding-bottom:24px"></div><div id="plan2037Area" style="display:none;padding-bottom:24px"></div><div id="plan2038Area" style="display:none;padding-bottom:24px"></div><div id="plan2039Area" style="display:none;padding-bottom:24px"></div><div id="plan2040Area" style="display:none;padding-bottom:24px"></div><div id="plan2031Area" style="display:none;padding-bottom:24px"></div><div id="plan2032Area" style="display:none;padding-bottom:24px"></div><div id="plan2033Area" style="display:none;padding-bottom:24px"></div><div id="plan2034Area" style="display:none;padding-bottom:24px"></div><div id="plan2035Area" style="display:none;padding-bottom:24px"></div><div id="plan2027Area" style="display:none;padding-bottom:24px"></div><div id="plan2028Area" style="display:none;padding-bottom:24px"></div><div id="plan2029Area" style="display:none;padding-bottom:24px"></div><div id="plan2030Area" style="display:none;padding-bottom:24px"></div><div id="divcalArea" style="display:none;padding-bottom:24px"></div><div id="historyArea" style="display:none;padding-bottom:24px"></div></div>
<div class="auth-overlay hidden" id="authOverlay">
  <form class="auth-card" onsubmit="handleLogin(event)">
    <h1>📈 <span>Index</span> Dashboard</h1>
    <div class="auth-sub">Войдите, чтобы синхронизировать данные между устройствами</div>
    <input type="email" id="authEmail" placeholder="Email" autocomplete="username" required>
    <input type="password" id="authPassword" placeholder="Пароль" autocomplete="current-password" required>
    <button class="primary" type="submit" id="authBtn">Войти</button>
    <div class="auth-error" id="authError"></div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
