<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index Portfolio Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://telegram-notify-abc.dmitriy-bilokon.workers.dev">
<link rel="preconnect" href="https://fvrebkwczqmeorytujbn.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://images.financialmodelingprep.com">
<link rel="preconnect" href="https://assets.parqet.com">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('dash_theme')||'dark';if(localStorage.getItem('dash_ui2')!=='0')document.documentElement.classList.add('ui2')}catch(e){document.documentElement.dataset.theme='dark';document.documentElement.classList.add('ui2')}</script>
<link rel="stylesheet" href="styles.css?v=20260612p">
</head>
<body>
<div class="header"><h1>📈 <span>Index</span> Portfolio Dashboard</h1><div class="header-sub">8 индексов + портфель • FX калькуляция • Ребалансировка</div><button class="theme-toggle" id="langBtn" onclick="toggleLang()" title="Язык / Language" style="font-size:11px;font-weight:700">EN</button><button class="theme-toggle" id="ui2Btn" onclick="toggleUI2()" title="Новый интерфейс (2026)">✨</button><button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Переключить тему">🌙</button><button class="theme-toggle" id="settingsBtn" onclick="toggleSettings()" title="Настройки доступа" style="display:none">⚙️</button><button class="theme-toggle" id="faqBtn" onclick="toggleFaq()" title="Справка по обозначениям">❓</button><button class="theme-toggle" id="logoutBtn" onclick="handleLogout()" title="Выйти" style="display:none">⏻</button></div>
<div class="tabs" id="tabs"></div>
<div class="sub-tabs" id="subTabs"></div>
<div class="sma-banner" id="smaBanner"></div>
<div class="toolbar" id="toolbarEl"><div class="index-info" id="indexInfo"></div><input type="text" class="search-box" id="searchBox" placeholder="🔍 Поиск..."><button class="btn" onclick="resetSort()">↕ Сброс</button><button class="btn" id="colsBtn" onclick="toggleColsMenu()" title="Показать/скрыть колонки">⚙ Колонки</button><button class="btn btn-del" id="delBtn" onclick="deleteSelected()" style="display:none">🗑</button><button class="btn" id="refreshPricesBtn" onclick="refreshLivePrices()" title="Обновить цены через Finnhub">🔄 Цены</button><button class="btn btn-export" onclick="exportCSV()">📥 CSV</button></div>
<div class="stats" id="statsBar"></div>
<div id="contentArea"><div class="table-wrap" id="tableArea"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div id="rankingArea" style="display:none;padding-bottom:24px"></div><div id="pf3Area" style="display:none"></div></div>
<div class="faq-overlay hidden" id="faqOverlay" onclick="if(event.target===this)toggleFaq()"><div class="faq-card" id="faqCard"></div></div>
<div class="faq-overlay hidden" id="setOverlay" onclick="if(event.target===this)toggleSettings()"><div class="faq-card" id="setCard"></div></div>
<div class="auth-overlay hidden" id="authOverlay">
  <form class="auth-card" onsubmit="handleLogin(event)">
    <h1>📈 <span>Index</span> Dashboard</h1>
    <div class="auth-sub">Войдите, чтобы синхронизировать данные между устройствами</div>
    <input type="email" id="authEmail" placeholder="Email" autocomplete="username" required>
    <input type="password" id="authPassword" placeholder="Пароль" autocomplete="current-password" required>
    <button class="primary" type="submit" id="authBtn">Войти</button>
    <div class="auth-error" id="authError"></div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js?v=20260612p"></script>
<script src="app.js?v=20260612p"></script>
</body>
</html>
